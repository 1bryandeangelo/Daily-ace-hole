<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}</style></head><body>
<title>Daily Hole</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
<style>
/* Layout: full-bleed 3D scene; glass HUD floats over it (hole card top, shot controls bottom). Single dusk-glass look by design, the scene supplies the color. */
:root{
  --ink:#f8ecd9;
  --ink-soft:#d6c9cc;
  --dusk:#1c1a31;
  --glass:rgba(24,22,42,.6);
  --glass-edge:rgba(248,236,217,.16);
  --ember:#f3a65c;
  --reed:#a8d48f;
  --splash:#8fc3e8;
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--dusk);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;touch-action:none}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 12px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top > div{min-width:0}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.hole-name{font-family:var(--display);font-style:italic;font-size:2rem;line-height:1.02;margin-top:2px;text-shadow:0 1px 18px rgba(20,10,30,.6);text-wrap:balance}
.hole-meta{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;color:var(--ink-soft);font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(20,10,30,.7)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:6px 12px 6px 8px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill svg{width:20px;height:20px;transition:transform .6s ease}
.wind-txt{font-family:var(--mono);font-size:.72rem;line-height:1.15;font-variant-numeric:tabular-nums}
.wind-txt small{display:block;color:var(--ink-soft);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase}
.balls{display:flex;gap:5px;align-items:center}
.balls i{width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.balls i.used{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-soft);opacity:.6}
.balls i.wet{background:var(--splash);box-shadow:none;opacity:.9}
.balls span{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.mini{font:500 .7rem/1 var(--mono);color:var(--ink);background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:7px 10px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.mid{flex:1;display:grid;place-items:center;min-height:0}
.card{pointer-events:auto;background:var(--glass);border:1px solid var(--glass-edge);border-radius:18px;padding:18px 20px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);width:min(330px,100%);text-align:center;display:flex;flex-direction:column;gap:6px;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
.card .big{font-family:var(--display);font-size:3.1rem;line-height:1;font-variant-numeric:tabular-nums}
.card .big.good{color:var(--reed)} .card .big.wet{color:var(--splash)} .card .big.ace{color:var(--ember)}
.card .detail{font-family:var(--mono);font-size:.75rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;line-height:1.5}
.emoji-row{font-size:1.5rem;letter-spacing:.15em;margin:2px 0}
.card.scroll{max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;gap:10px}
.mid{padding-block:4px}
.ladder{font-family:var(--mono);font-size:.78rem;color:var(--ink-soft);margin-top:-2px}
.ladder b{color:var(--ink);font-weight:500}
.vs{border:1.5px solid var(--reed);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.vs.lost{border-color:var(--glass-edge)}
.vs .eyebrow{text-align:center}
.vs-head{font-family:var(--display);font-size:1.9rem;line-height:1;text-align:center;color:var(--reed)}
.vs.lost .vs-head{color:var(--ink)}
.vs-row{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.vs-row span:last-child{color:var(--ink-soft)}
.streak{font-weight:600;font-size:.92rem}
.newb{border:1.5px solid var(--ember);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.newb .eyebrow{color:var(--ember)}
.newb-lead{display:flex;gap:10px;align-items:center}
.newb-lead .ic{font-size:2rem;line-height:1}
.newb-lead b{display:block;font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1.05}
.newb-lead span{font-size:.82rem;color:var(--ink-soft)}
.newb-more{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem}
.style{display:flex;flex-direction:column;gap:4px;padding-top:2px}
.style-name{font-family:var(--display);font-size:2rem;line-height:1}
.linkish{background:none;color:var(--reed);padding:0;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.badge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;text-align:left}
.badge{display:flex;gap:8px;align-items:flex-start;padding:9px;border-radius:12px;background:rgba(255,255,255,.05);min-width:0}
.badge .ic{font-size:1.3rem;line-height:1.2}
.badge b{display:block;font-size:.82rem}
.badge span{display:block;font-size:.72rem;color:var(--ink-soft);line-height:1.35}
.badge.locked{opacity:.38}
.badge.locked .ic{filter:grayscale(1)}
.tier{font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ember)}
.share{font-family:var(--mono);font-size:.7rem;color:var(--ink-soft);white-space:pre-line;-webkit-user-select:text;user-select:text;background:rgba(0,0,0,.18);border-radius:10px;padding:8px 10px;text-align:left}
.btns{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
button{font:600 .9rem/1 var(--body);color:var(--dusk);background:var(--ink);border:0;border-radius:999px;padding:11px 18px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--glass-edge)}
button:focus-visible,.chip:focus-visible,.mini:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

.bottom{display:flex;flex-direction:column;gap:8px;align-items:center}
.hint{font-size:.9rem;text-align:center;max-width:32ch;text-wrap:balance;text-shadow:0 1px 12px rgba(20,10,30,.85);min-height:2.4em;display:flex;align-items:flex-end;justify-content:center}
.rows{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:100%}
.bar{pointer-events:auto;display:flex;align-items:center;gap:2px;background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:4px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip{font:500 .8rem/1 var(--mono);color:var(--ink);background:transparent;padding:9px 11px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip small{color:var(--ink-soft);margin-left:5px;font-size:.7rem}
.chip.step{padding:9px 9px;font-size:.9rem}
.chip.readout{min-width:6.6em;text-align:center;padding-inline:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--dusk)}
.chip[aria-pressed="true"] small{color:#5a4e66}
.meter{position:fixed;right:calc(max(16px, env(safe-area-inset-right, 0px)) + 2px);top:34%;height:28%;width:8px;border-radius:8px;background:rgba(248,236,217,.18);overflow:hidden;opacity:0;transition:opacity .2s}
.meter.show{opacity:1}
.meter i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,var(--reed),var(--ember));border-radius:8px}
.meter::after{content:"";position:absolute;left:-3px;right:-3px;bottom:89%;height:2px;background:var(--ink)}
@media (prefers-reduced-motion:reduce){.card{animation:none}.pill svg{transition:none}}
</style>

<canvas id="scene" aria-label="3D view of today's par 3"></canvas>
<div class="meter" id="meter"><i id="meterFill"></i></div>
<div class="hud">
  <header class="top">
    <div>
      <div class="eyebrow" id="holeNo">Daily Hole</div>
      <div class="hole-name" id="holeName">Loading</div>
      <div class="hole-meta" id="holeMeta"></div>
    </div>
    <div class="side">
      <div class="pill" title="Wind">
        <svg id="windArrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l5 7h-3.2v11h-3.6V10H7z" fill="currentColor"/></svg>
        <div class="wind-txt"><span id="windMph">0 mph</span><small id="windDir">calm</small></div>
      </div>
      <div class="balls" id="balls" aria-label="Balls"></div>
      <button class="mini" id="inputBtn">Input: Swipe</button>
      <button class="mini" id="feelBtn" hidden>Feel: Normal</button>
    </div>
  </header>

  <div class="mid">
    <div class="card" id="result" hidden>
      <div class="eyebrow" id="resEyebrow">From the pin</div>
      <div class="big" id="resBig">—</div>
      <div class="detail" id="resDetail"></div>
      <div class="btns"><button id="nextBtn">Next ball</button></div>
    </div>
    <div class="card scroll" id="summary" hidden>
      <div class="eyebrow" id="sumEyebrow">Today's result</div>
      <div class="big good" id="sumBest">—</div>
      <div class="ladder" id="sumLadder"></div>
      <div class="emoji-row" id="sumEmoji"></div>
      <div class="vs" id="sumVs">
        <div class="eyebrow" id="vsEyebrow">You vs the Tour</div>
        <div class="vs-head" id="vsHead">—</div>
        <div class="vs-row"><span>Your best</span><span id="vsYou">—</span></div>
        <div class="vs-row"><span>Tour average from <span id="vsBucket"></span></span><span id="vsTour">—</span></div>
      </div>
      <div class="streak" id="sumStreak"></div>
      <div class="newb" id="sumNew" hidden>
        <div class="eyebrow" id="newCount">New badge</div>
        <div class="newb-lead"><div class="ic" id="newIc"></div><div><b id="newName"></b><span id="newDesc"></span></div></div>
        <div class="newb-more" id="newMore"></div>
        <button class="linkish" id="allBadgesBtn">All your badges</button>
      </div>
      <div class="style">
        <div class="eyebrow">Today you played it like a</div>
        <div class="style-name" id="styleName">—</div>
        <div class="detail" id="styleWhy"></div>
      </div>
      <div class="share" id="shareText"></div>
      <div class="detail" id="countdown"></div>
      <div class="btns"><button id="copyBtn">Copy result</button><button class="ghost" id="practiceBtn">Practice</button><button class="ghost" id="allBadgesBtn2">Badges</button></div>
    </div>
    <div class="card scroll" id="badgeCard" hidden>
      <div class="eyebrow" id="badgeCount">Badges</div>
      <div class="badge-grid" id="badgeGrid"></div>
      <div class="btns"><button id="badgeClose">Done</button></div>
    </div>
  </div>

  <footer class="bottom" id="controls">
    <div class="hint" id="hint"></div>
    <div class="rows">
      <div class="bar" role="group" aria-label="Club and shot">
        <button class="chip step" id="clubDown" aria-label="Less club">‹</button>
        <span class="chip readout" id="clubLbl">7i<small>164</small></span>
        <button class="chip step" id="clubUp" aria-label="More club">›</button>
        <button class="chip" id="shotFull" aria-pressed="true">Full</button>
        <button class="chip" id="shotKnock" aria-pressed="false">Knock</button>
      </div>
      <div class="bar" role="group" aria-label="Aim and read">
        <button class="chip step" id="aimL" aria-label="Aim left">◀</button>
        <span class="chip readout" id="aimLbl">At pin</span>
        <button class="chip step" id="aimR" aria-label="Aim right">▶</button>
        <button class="chip" id="readBtn" aria-pressed="false">Read green</button>
      </div>
    </div>
  </footer>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);

// ---------- canvas ----------
const cv = $('scene'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, F = 1000, CY = 400;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  F = Math.min(H*1.25, W*2.3); CY = H*0.5;
}
window.addEventListener('resize', resize); resize();

// ---------- the day ----------
const EPOCH = Date.UTC(2026, 9, 17);
function nyDateKey(d){ return new Intl.DateTimeFormat('en-CA', {timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit'}).format(d); }
const todayKey = nyDateKey(new Date());
let holeNum = Math.round((Date.parse(todayKey + 'T00:00:00Z') - EPOCH)/86400000) + 1;
let preview = false;
const hm = /^#h(\d{1,4})$/.exec(location.hash || '');
if (hm){ holeNum = Math.max(1, +hm[1]); preview = true; }
function hash(n){ let h = 2166136261 ^ n; for (let i=0;i<6;i++){ h = Math.imul(h ^ (h >>> 13), 0x5bd1e995); h ^= h >>> 15; } return h >>> 0; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(hash(holeNum * 7919));
const rr = (a, b) => a + R()*(b-a);
const fxR = rng(99);   // cosmetic randomness that does not need to match between players

const NAMES = ['Osprey Point','Cedar Bluff','Heron Lake','Saltmarsh','Granite Ridge','Fox Hollow','Willow Bend','Kestrel Cove','Juniper Flats','Lantern Hill','Bramble Pond','Stillwater','Quarry Rise','Larkspur','Old Mill Run','Ironwood'];
const holeName = NAMES[Math.floor(R()*NAMES.length)];

// ---------- palettes ----------
const PALETTES = {
  golden: {sky:['#272a57','#6b4f7f','#d77f7c','#f6b67f','#fbd59a'], sun:[0.13,0.085], core:'#fff4da', glow:'255,214,150',
    ridges:[['#b48aa0','#d7a59a'],['#7c6487','#a77c8c'],['#45405f','#5e5170']], gfar:'#8d7d5e', gmid:'#4c6c37', gnear:'#3a5d2c',
    water:['#f6c890','#d99487','#6d5f86','#2f3c63'], tree:['#23332c','#2b3a2a'], haze:'#9a7487', rim:'255,190,120', green:['#83bb58','#649d43'], fringe:'#5a8b3b', fair:'#4f7e37', mist:0, kind:'pine', cloud:'255,200,160'},
  mist: {sky:['#7f93b5','#aab6cc','#d9d2da','#f1dfd0','#f6e9dc'], sun:[-0.22,0.12], core:'#fffaf0', glow:'255,240,215',
    ridges:[['#a4adc2','#c4c6d2'],['#8591a8','#a6abbc'],['#5a6680','#717a92']], gfar:'#9ea795', gmid:'#58784a', gnear:'#3d6233',
    water:['#f1ece6','#cdd2dc','#7f8fb0','#3b4d6e'], tree:['#21322d','#2a3a33'], haze:'#aab3c2', rim:'255,245,225', green:['#7db65a','#5f9a45'], fringe:'#55873d', fair:'#4c7c38', mist:1, kind:'pine', cloud:'255,245,235'},
  autumn: {sky:['#365f97','#5f8dbf','#9dbcd6','#e6d8b8','#f3e0b1'], sun:[0.26,0.16], core:'#fffbe8', glow:'255,236,180',
    ridges:[['#8ea2b8','#b5bfc4'],['#6e8197','#909da8'],['#4d5a66','#65707a']], gfar:'#a59b67', gmid:'#5a7440', gnear:'#41632f',
    water:['#e3e7e3','#a9bfd0','#4f6f99','#26395e'], tree:['#2a3b2c','#33402b'], haze:'#a3b0bd', rim:'255,225,170', green:['#86bd5a','#669f45'], fringe:'#5c8c3d', fair:'#52803a', mist:0, kind:'mixed', cloud:'255,250,240',
    leaves:['#c4562b','#d98c2b','#a8361f','#e0b03a','#b8642a']},
};
const PAL_NAME = ['golden','mist','autumn'][Math.floor(R()*3)];
const PAL = PALETTES[PAL_NAME];

// ---------- hole generation ----------
const SIDE = R() < 0.5 ? -1 : 1;                      // the side the water wraps
const GR = {x:rr(-7,7)*-SIDE, z:rr(148,184), rx:rr(20,24), rz:rr(16.5,20), rot:rr(-0.35,0.35), p1:rr(0,6.28), p2:rr(0,6.28)};
const FRINGE_W = 3.2;
const AVG_R = (GR.rx + GR.rz)/2;
function lobe(a){ return 1 + 0.07*Math.sin(3*a + GR.p1) + 0.05*Math.cos(2*a + GR.p2); }
function gDist(x, z){ // normalized distance from green centre: 1 = green edge
  const c = Math.cos(-GR.rot), s = Math.sin(-GR.rot); const dx = x-GR.x, dz = z-GR.z;
  const px = dx*c - dz*s, pz = dx*s + dz*c; const a = Math.atan2(pz/GR.rz, px/GR.rx);
  return Math.hypot(px/GR.rx, pz/GR.rz) / lobe(a);
}
function shapePts(scale, n=64){ // outline at normalized distance `scale`
  const pts = []; const c = Math.cos(GR.rot), s = Math.sin(GR.rot);
  for (let i=0;i<n;i++){ const a = i/n*Math.PI*2; const l = lobe(a)*scale; const px = Math.cos(a)*GR.rx*l, pz = Math.sin(a)*GR.rz*l; pts.push([GR.x + px*c - pz*s, GR.z + px*s + pz*c]); }
  return pts;
}
const FRINGE_SCALE = 1 + FRINGE_W/AVG_R;
const greenPts = shapePts(1), fringePts = shapePts(FRINGE_SCALE);

// contours: tilt, a tier, and mounds/hollows
const TILT = {z:rr(0.012,0.024), x:rr(-0.012,0.012)};
const TIER = R() < 0.7 ? {ang:rr(0,6.28), off:rr(-6,6), h:rr(0.3,0.55)} : null;
const BUMPS = Array.from({length:4+Math.floor(R()*3)}, () => { const a = rr(0,6.28), d = rr(0,0.85); return {x:GR.x + Math.cos(a)*GR.rx*d, z:GR.z + Math.sin(a)*GR.rz*d, r:rr(3.5,8), a:rr(0.18,0.55)*(R()<0.6?1:-1)}; });
function rawH(x, z){
  let h = TILT.z*(z-GR.z) + TILT.x*(x-GR.x);
  if (TIER){ const t = ((x-GR.x)*Math.cos(TIER.ang) + (z-GR.z)*Math.sin(TIER.ang) - TIER.off)/1.6; h += TIER.h/(1+Math.exp(-t)); }
  for (const b of BUMPS){ const d2 = ((x-b.x)**2 + (z-b.z)**2)/(b.r*b.r); if (d2 < 9) h += b.a*Math.exp(-d2); }
  return h;
}
let RAW_MIN = Infinity; for (let i=0;i<400;i++){ const a = rr(0,6.28), d = Math.sqrt(R())*FRINGE_SCALE; const x = GR.x + Math.cos(a)*GR.rx*d, z = GR.z + Math.sin(a)*GR.rz*d; RAW_MIN = Math.min(RAW_MIN, rawH(x,z)); }
const BANK = 8;  // yards over which the green's contours fade into the surrounds
const BOX = {x0:GR.x-GR.rx*1.15-BANK-2, x1:GR.x+GR.rx*1.15+BANK+2, z0:GR.z-GR.rz*1.15-BANK-2, z1:GR.z+GR.rz*1.15+BANK+2};
function Hh(x, z){
  if (x < BOX.x0 || x > BOX.x1 || z < BOX.z0 || z > BOX.z1) return 0;
  const d = gDist(x, z); let m = 1;
  if (d > 1){ const t = Math.min(1, (d-1)*AVG_R/BANK); m = 1 - t*t*(3-2*t); }
  if (m <= 0) return 0;
  return m*(rawH(x, z) - RAW_MIN + 0.08);
}
function grad(x, z){ const e = 0.25; return [(Hh(x+e,z)-Hh(x-e,z))/(2*e), (Hh(x,z+e)-Hh(x,z-e))/(2*e)]; }

// pin: a random spot that is putting-flat enough
let PIN = null;
for (let tries=0; tries<60 && !PIN; tries++){
  const a = rr(0,6.28), d = rr(0.2,0.78); const x = GR.x + Math.cos(a)*GR.rx*d, z = GR.z + Math.sin(a)*GR.rz*d;
  const g = grad(x, z); if (gDist(x,z) < 0.8 && Math.hypot(g[0], g[1]) < 0.03) PIN = {x, z};
}

// ---------- shots & physics ----------
const G = 10.72, KD = 0.005, KL = 0.004;
const CLUBS = [
  {id:'PW', name:'Pitching wedge', speed:44, launch:26, carry:128},
  {id:'9i', name:'9 iron', speed:47.5, launch:23.5, carry:141},
  {id:'8i', name:'8 iron', speed:51, launch:21, carry:153},
  {id:'7i', name:'7 iron', speed:54.5, launch:18.5, carry:164},
  {id:'6i', name:'6 iron', speed:58, launch:16.5, carry:175},
  {id:'5i', name:'5 iron', speed:61.5, launch:14.5, carry:185},
];
const SURF = { // first-bounce speed kept, bounce height, rolling decel (yd/s²)
  green:{keep:0.22, e:0.16, dec:0.75}, fringe:{keep:0.3, e:0.2, dec:1.6}, fairway:{keep:0.42, e:0.25, dec:1.5},
  rough:{keep:0.2, e:0.12, dec:5}, tee:{keep:0.35, e:0.2, dec:2}, sand:{keep:0.03, e:0.02, dec:40} };
let clubIdx = CLUBS.findIndex(c => c.carry >= YARDS - 4); if (clubIdx < 0) clubIdx = CLUBS.length-1;
let shotType = 'full', aimOff = 0;
const ball = {x:0, y:0.05, z:0, vx:0, vy:0, vz:0, spin:0, side:0, state:'tee', trail:[], carry:0, landed:false, wet:false, t:0};
let phase = 'ready';
const splashes = [];

function launchParams(power){
  const c = CLUBS[clubIdx]; const knock = shotType === 'knock';
  const speed = c.speed*(knock ? 0.95 : 1)*(0.32 + 0.68*Math.min(power, 1.06));
  const launch = (c.launch - (knock ? 4 : 0) - (power < 0.25 ? 8 : 0))*Math.PI/180;
  return {speed, launch, spin: knock ? 0.75 : 1};
}
function aimYaw(){ return Math.atan2(PIN.x + aimOff, PIN.z); }
function launch(power, curve){
  if (phase !== 'ready' || reading) return;
  const p = Math.max(0, Math.min(1.12, power)); let cu = Math.max(-1, Math.min(1, curve));
  if (p > 1) cu += (fxR()-0.5)*(p-1)*6;
  const L = launchParams(p); const yaw = aimYaw() + cu*0.035;
  Object.assign(ball, {x:0, y:0.05, z:0, vx:L.speed*Math.cos(L.launch)*Math.sin(yaw), vy:L.speed*Math.sin(L.launch), vz:L.speed*Math.cos(L.launch)*Math.cos(yaw), spin:L.spin, side:cu*5.5, state:'air', trail:[], carry:0, landed:false, wet:false, t:0});

}
function stepBall(dt, b, sim){
  b.t += dt;

    const v = Math.hypot(b.vx, b.vy, b.vz), vh = Math.hypot(b.vx, b.vz) || 1;
    const wx = sim ? 0 : WIND.x, wz = sim ? 0 : WIND.z;
    b.vx += (-KD*v*b.vx + wx*0.05 + b.side*b.spin*(b.vz/vh))*dt;
    b.vz += (-KD*v*b.vz + wz*0.05 - b.side*b.spin*(b.vx/vh))*dt;
    b.vy += (-G - KD*v*b.vy + KL*v*v*b.spin)*dt;
    b.x += b.vx*dt; b.y += b.vy*dt; b.z += b.vz*dt; b.spin *= Math.exp(-dt/7);
    const gh = Hh(b.x, b.z);
    if (b.y <= gh && b.vy < 0){
      b.y = gh; const s = surfaceAt(b.x, b.z);
      if (!b.landed){ b.landed = true; b.carry = Math.hypot(b.x, b.z); b.landX = b.x; b.landZ = b.z; if (!sim) { ball.landX = b.x; ball.landZ = b.z; } if (sim) { b.state = 'stopped'; return; } }

      b.bounced = true; b.vx *= keep; b.vz *= keep; b.vy = -b.vy*S.e; b.spin *= 0.3; b.side = 0;

    }
  } else if (b.state === 'roll'){
    const s = surfaceAt(b.x, b.z); if (s === 'water') return splash(b);
    const S = SURF[s]; const g = grad(b.x, b.z); const sp = Math.hypot(b.vx, b.vz);
    const ax = -G*5/7*g[0], az = -G*5/7*g[1]; const slopeA = Math.hypot(ax, az);

    if (sp < 0.04 && slopeA < S.dec*0.9 || b.t > 40){ b.vx = b.vz = 0; b.state = 'stopped'; return finish(); }

function splash(b){

// predicted landing spot (no wind, full power) for the aim marker
let predicted = null;
function predict(){

  const b = {x:0, y:0.05, z:0, vx:L.speed*Math.cos(L.launch)*Math.sin(yaw), vy:L.speed*Math.sin(L.launch), vz:L.speed*Math.cos(L.launch)*Math.cos(yaw), spin:L.spin, side:0, state:'air', t:0};

}

const BALLS = 3;

const daily = loadShots();
let practice = false;

function finish(){
  phase = 'done';
  const dPin = Math.hypot(ball.x-PIN.x, ball.z-PIN.z);
  const surf = ball.state === 'holed' ? 'holed' : ball.wet ? 'water' : surfaceAt(ball.x, ball.z);
  const landD = ball.landX === undefined ? dPin : Math.hypot(ball.landX-PIN.x, ball.landZ-PIN.z);
  const landSurf = ball.landX === undefined ? surf : surfaceAt(ball.landX, ball.landZ);
  const landPast = ball.landZ !== undefined && Math.hypot(ball.landX, ball.landZ) > YARDS;
  const shot = {d:+dPin.toFixed(3), surf, carry:Math.round(ball.carry), club:CLUBS[clubIdx].id, type:shotType, aim:aimOff, landD:+landD.toFixed(2), landSurf, landPast};
  if (!practice){ daily.push(shot); saveShots(); renderBalls(); }
  setTimeout(() => showResult(shot), ball.wet ? 900 : 500);
}
function fmtDist(yd){ const ft = yd*3; if (ft >= 90) return `${Math.round(yd)} yds`; const f = Math.floor(ft), inch = Math.round((ft-f)*12); return inch === 12 ? `${f+1} ft` : `${f} ft ${inch} in`; }
const SURF_LABEL = {green:'on the green', fringe:'on the fringe', sand:'in the bunker', rough:'in the rough', fairway:'on the fairway', tee:'still on the tee', water:'in the water', holed:'in the cup'};
const EMOJI = s => s.surf === 'holed' ? '🏆' : s.surf === 'water' ? '💧' : s.surf === 'green' ? (s.d*3 <= 10 ? '🎯' : '🟢') : s.surf === 'sand' ? '🟫' : (s.surf === 'fringe' || s.surf === 'fairway') ? '🟡' : '🟤';

// ---------- benchmarks, styles, badges ----------
// Tour proximity by yardage bucket, approximate from PGA Tour stat pages; amateur ladder from published handicap proximity guides.
const TOUR_FT = YARDS < 150 ? 23 : YARDS < 175 ? 28 : YARDS < 200 ? 33 : 40;
const TOUR_BUCKET = YARDS < 150 ? '125-150 yds' : YARDS < 175 ? '150-175 yds' : YARDS < 200 ? '175-200 yds' : '200-225 yds';
const LADDER = [[1, 'Tour pro'], [1.7, 'Scratch'], [2.05, '5 handicap'], [2.4, '10 handicap'], [2.8, '15 handicap'], [3.2, '20 handicap']];

function playStyle(list){
  const wet = list.filter(s => s.surf === 'water').length, knock = list.filter(s => s.type === 'knock').length;
  const away = list.filter(s => Math.abs(s.aim || 0) >= 6).length, fed = list.filter(s => s.surf !== 'water' && s.landD - s.d >= 3).length;
  const full = list.filter(s => s.type === 'full' && !s.aim).length;
  if (wet >= 2) return ['Hero', `You took on the water ${wet} times. Bold.`];
  if (knock >= 2) return ['Links grinder', `${knock} of your 3 balls went low and ran. Most players fly it all the way.`];
  if (away >= 2 && fed >= 1) return ['Green reader', 'You aimed away from the flag and let the slopes bring it back.'];
  if (fed >= 2) return ['Slope whisperer', `${fed} of your balls finished closer than they landed.`];
  if (full === list.length) return ['Flag hunter', 'Every ball went full and straight at the stick.'];
  return ['Steady hand', 'A mix of shots, no big risks.'];
}

  const v = ctx.createRadialGradient(W/2, H*0.45, Math.min(W,H)*0.35, W/2, H*0.5, Math.max(W,H)*0.85); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(25,12,30,.42)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);
}

renderHeader(); renderBalls(); renderClub(); setModeUI();
if (daily.length >= BALLS) showSummary(); else readyHint();
requestAnimationFrame(frame);
})();
</script>
